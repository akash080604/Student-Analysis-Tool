<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: url('login.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 5px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center; /* Center text */
        }

        h1 {
            font-size: 36px;
            color: black;
            margin: 0;
        }

        .email-display {
            font-size: 24px;
            color: black;
            margin-top: 20px;
        }

        .toggle-switch {
            position: relative;
            width: 60px;
            height: 30px;
        }

        .toggle-switch input {
            display: none;
        }

        .slider {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: black;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.4s;
        }

        .slider:before {
            content: "";
            position: absolute;
            width: 26px;
            height: 26px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            border-radius: 50%;
            transition: 0.4s;
        }

        input:checked + .slider {
            background-color: green;
        }

        input:checked + .slider:before {
            transform: translateX(30px);
        }

        .enter-btn {
            border: none;
            background-color: #3377a4;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .enter-btn:hover {
            background-color: #00695c;
            color: white;
        }
    </style>
    <script>
        function redirectToNextPage() {
            const isTwoWayAuthEnabled = document.getElementById('two-way-auth').checked;
            const email = getEmailFromUrl();
            const password = 'yourPassword'; // You need to obtain this from your login process

            if (isTwoWayAuthEnabled) {
                // Redirect to auth.php with two-way authentication enabled
                window.location.href = `auth.php?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}&auth=1`;
            } else {
                // Redirect to auth.php with two-way authentication disabled
                window.location.href = `auth.php?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}&auth=0`;
            }

            // Redirect to login.html page (you can add this conditionally if needed)
            // window.location.href = 'login.html';
        }

        function getEmailFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('email');
        }

        window.onload = function() {
            const email = getEmailFromUrl();
            if (email) {
                document.getElementById('emailDisplay').innerText = `Email : ${email}`;
            }
        }
    </script>
</head>
<body>

    <div class="container">
        <h1>Welcome</h1>
        <div class="email-display" id="emailDisplay"></div>
        <label for="two-way-auth">Two-way Authentication :</label>
        <div class="toggle-switch">
            <input type="checkbox" id="two-way-auth">
            <label for="two-way-auth" class="slider"></label>
        </div>
        <button class="enter-btn" onclick="redirectToNextPage()">Enter</button>
    </div>

</body>
</html>
